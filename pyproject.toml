[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-history-search"
version = "0.1.0"
description = "JSONL AI conversation mining extension for semantic debugging workflows"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Semantic Linter contributors"}]

[project.scripts]
jsonl-history-search = "jsonl_history_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
