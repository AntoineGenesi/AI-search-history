[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-history-search"
version = "0.1.1"
description = "JSONL AI conversation mining extension for semantic debugging workflows"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "JSONL contributors"}]

[project.scripts]
jsonl-history-search = "jsonl_history_search.cli:main"
convo = "jsonl_history_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/jsonl-history-search/codex-skill" = ["skills/codex/jsonl-history-search/SKILL.md"]
"share/jsonl-history-search/codex-skill/references" = ["skills/codex/jsonl-history-search/references/*.md"]
"share/jsonl-history-search/codex-skill/scripts" = ["scripts/search_jsonl_history.py", "scripts/jsonl_ask_first.py"]
"share/jsonl-history-search/claude-skill" = ["skills/claude/jsonl-history-search/SKILL.md"]
"share/jsonl-history-search/claude-skill/references" = ["skills/claude/jsonl-history-search/references/*.md"]
"share/jsonl-history-search/claude-skill/scripts" = ["scripts/search_jsonl_history.py", "scripts/jsonl_ask_first.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
